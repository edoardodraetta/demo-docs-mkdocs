# https://www.mkdocs.org/getting-started/
site_name: Math Tools Demo
site_description: A demo package for testing documentation
repo_url: https://github.com/edoardodraetta/docs-demo-mkdocs

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Tutorials:
    - Overview: tutorials/tutorials.md
    - Basic Operations: tutorials/basic_operations.ipynb
  - API Reference: api.md

# Enable version drop-down
extra:
  version:
    provider: mike
    default: latest

plugins:
  - search
  - mkdocstrings: # mkdocstrings will automatically generate API reference pages
      handlers:
        python:
          options:
            show_source: true
  - mkdocs-jupyter:
      include_source: True